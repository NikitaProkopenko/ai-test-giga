<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <nav class="nav">
        <a href="#" class="nav-link">Gmail</a>
        <a href="#" class="nav-link">Картинки</a>
        <button class="nav-apps" aria-label="Приложения Google">
          <svg focusable="false" viewBox="0 0 24 24" width="24" height="24">
            <path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"></path>
          </svg>
        </button>
        <a href="#" class="nav-signin">Войти</a>
      </nav>
    </header>

    <main class="main">
      <div class="logo" aria-label="Google">
        <span class="logo-g logo-blue">G</span><span class="logo-o logo-red">o</span><span class="logo-o2 logo-yellow">o</span><span class="logo-g2 logo-blue">g</span><span class="logo-l logo-green">l</span><span class="logo-e logo-red">e</span>
      </div>

      <div class="search-wrapper">
        <div class="search-box" id="searchBox">
          <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
          </svg>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder=""
            autocomplete="off"
            aria-label="Поиск"
          />
          <button class="mic-btn" aria-label="Поиск голосом" title="Поиск голосом">
            <svg focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285f4" d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path>
            </svg>
          </button>
        </div>

        <div class="suggestions" id="suggestions" role="listbox" aria-label="Подсказки поиска"></div>

        <div class="search-buttons">
          <button class="btn-search" id="submitBtn">Отправить</button>
          <button class="btn-lucky">Мне повезёт!</button>
        </div>
      </div>

      <div class="result-panel" id="resultPanel" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <div class="footer-top">
        <span>Россия</span>
      </div>
      <div class="footer-bottom">
        <div class="footer-left">
          <a href="#">Реклама</a>
          <a href="#">Бизнес</a>
          <a href="#">Поиск</a>
        </div>
        <div class="footer-right">
          <a href="#">Конфиденциальность</a>
          <a href="#">Условия</a>
          <a href="#">Настройки</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
