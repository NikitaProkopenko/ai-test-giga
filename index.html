<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="output" id="output" aria-live="polite" aria-label="Область ответа">
      <span class="placeholder">Ответ появится здесь...</span>
    </div>

    <div class="input-row">
      <input
        type="text"
        id="userInput"
        class="input"
        placeholder="Введите сообщение..."
        autocomplete="off"
        aria-label="Поле ввода"
      />
      <button id="submitBtn" class="btn" aria-label="Отправить">Отправить</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
